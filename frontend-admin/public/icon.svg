<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="80" fill="#1e40af"/>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="370" rx="160" ry="14" fill="#1e3a8a" opacity="0.5"/>

  <!-- Car undercarriage -->
  <rect x="80" y="255" width="340" height="80" rx="20" fill="#1e3a8a"/>

  <!-- Car body -->
  <rect x="95" y="210" width="310" height="100" rx="16" fill="#3b82f6"/>

  <!-- Car roof -->
  <rect x="145" y="160" width="210" height="75" rx="14" fill="#2563eb"/>

  <!-- Windows -->
  <rect x="158" y="173" width="80" height="52" rx="8" fill="#bfdbfe"/>
  <rect x="262" y="173" width="80" height="52" rx="8" fill="#bfdbfe"/>

  <!-- Body highlight stripe -->
  <rect x="95" y="238" width="310" height="16" rx="4" fill="#60a5fa"/>

  <!-- Headlights -->
  <rect x="95" y="258" width="38" height="24" rx="7" fill="#fef08a"/>
  <rect x="367" y="258" width="38" height="24" rx="7" fill="#fef08a"/>

  <!-- Left wheel -->
  <circle cx="178" cy="318" r="42" fill="#0f172a"/>
  <circle cx="178" cy="318" r="28" fill="#334155"/>
  <circle cx="178" cy="318" r="13" fill="#e2e8f0"/>
  <line x1="178" y1="290" x2="178" y2="346" stroke="#e2e8f0" stroke-width="3.5"/>
  <line x1="150" y1="318" x2="206" y2="318" stroke="#e2e8f0" stroke-width="3.5"/>

  <!-- Right wheel -->
  <circle cx="322" cy="318" r="42" fill="#0f172a"/>
  <circle cx="322" cy="318" r="28" fill="#334155"/>
  <circle cx="322" cy="318" r="13" fill="#e2e8f0"/>
  <line x1="322" y1="290" x2="322" y2="346" stroke="#e2e8f0" stroke-width="3.5"/>
  <line x1="294" y1="318" x2="350" y2="318" stroke="#e2e8f0" stroke-width="3.5"/>

  <!-- GPS pin -->
  <circle cx="250" cy="148" r="12" fill="#f97316"/>
  <circle cx="250" cy="148" r="6" fill="white"/>
  <line x1="250" y1="136" x2="250" y2="118" stroke="#f97316" stroke-width="3"/>
  <circle cx="250" cy="113" r="7" fill="#f97316"/>
  <circle cx="250" cy="113" r="3.5" fill="white"/>
</svg>
